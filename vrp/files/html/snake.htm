<!doctype html>
<!-- Created by Mistral Vibe -->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Snake</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
			}

			body {
				background: #111827;
				display: flex;
				align-items: center;
				justify-content: center;
				flex-direction: column;
				font-family: system-ui, sans-serif;
				color: #fff;
				user-select: none;
				overflow: hidden;
			}

			canvas {
				display: block;
				background: #1f2937;
			}

			#score {
				position: fixed;
				top: 10px;
				left: 14px;
				font-size: 18px;
				color: #9ca3af;
			}
		</style>
	</head>
	<body>
		<canvas id="game" width="400" height="400"></canvas>
		<div id="score">0</div>
		<script>
			const canvas = document.getElementById("game");
			const ctx = canvas.getContext("2d");
			const scoreEl = document.getElementById("score");
			let cols = 20,
				rows = 20,
				cell = 20;

			// scale: how many cells you want across the smaller screen dimension
			// lower = bigger cells (better for small screens), higher = finer grid
			const SCALE = 15;
			const MIN_CELL = 10;

			function resize() {
				canvas.width = window.innerWidth;
				canvas.height = window.innerHeight;
				// pick a cell size so the grid fully covers the window at any resolution
				// floor instead of ceil so no cell is ever cut off at the screen edge
				cell = Math.max(MIN_CELL, Math.floor(Math.min(canvas.width, canvas
					.height) / SCALE));
				cols = Math.floor(canvas.width / cell);
				rows = Math.floor(canvas.height / cell);
				if (playing) {
					// keep snake inside the new bounds
					if (snake[0].x >= cols || snake[0].y >= rows) gameOver();
					if (food.x >= cols || food.y >= rows) spawnFood();
				}
				if (snake) draw();
			}
			window.addEventListener("resize", resize);

			let snake, dir, nextDir, food, score, playing, timer;
			let started = false;

			function spawnFood() {
				do {
					food = {
						x: Math.floor(Math.random() * cols),
						y: Math.floor(Math.random() * rows)
					};
				} while (snake.some(s => s.x === food.x && s.y === food.y));
			}

			function start() {
				started = true;
				const cx = Math.floor(cols / 2),
					cy = Math.floor(rows / 2);
				snake = [{
					x: cx,
					y: cy
				}, {
					x: cx - 1,
					y: cy
				}, {
					x: cx - 2,
					y: cy
				}];
				dir = {
					x: 1,
					y: 0
				};
				nextDir = dir;
				score = 0;
				playing = true;
				spawnFood();
				scoreEl.textContent = score;
				clearInterval(timer);
				timer = setInterval(tick, 120);
			}

			function gameOver() {
				playing = false;
				clearInterval(timer);
				scoreEl.textContent = score;
			}

			function tick() {
				dir = nextDir;
				const head = {
					x: snake[0].x + dir.x,
					y: snake[0].y + dir.y
				};
				if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows ||
					snake.some(s => s.x === head.x && s.y === head.y)) {
					gameOver();
					draw();
					return;
				}
				snake.unshift(head);
				if (head.x === food.x && head.y === food.y) {
					score += 1;
					scoreEl.textContent = score;
					spawnFood();
				} else {
					snake.pop();
				}
				draw();
			}

			function draw() {
				ctx.fillStyle = "#1f2937";
				ctx.fillRect(0, 0, canvas.width, canvas.height);
				// center the grid: leftover pixels are split between both sides
				const ox = Math.floor((canvas.width - cols * cell) / 2);
				const oy = Math.floor((canvas.height - rows * cell) / 2);
				// food
				ctx.fillStyle = "#ef4444";
				ctx.beginPath();
				ctx.arc(ox + (food.x + 0.5) * cell, oy + (food.y + 0.5) * cell, cell / 2 -
					2, 0, Math.PI * 2);
				ctx.fill();
				// snake
				snake.forEach((s, i) => {
					ctx.fillStyle = i === 0 ? "#a3e635" : "#4ade80";
					ctx.fillRect(ox + s.x * cell + 1, oy + s.y * cell + 1, cell -
						2, cell - 2);
				});
				if (started && !playing) {
					ctx.fillStyle = "rgba(0,0,0,0.5)";
					ctx.fillRect(0, 0, canvas.width, canvas.height);
					ctx.fillStyle = "#fff";
					ctx.font = "bold " + Math.round(canvas.height / 15) +
						"px system-ui, sans-serif";
					ctx.textAlign = "center";
					ctx.fillText(started ? "Game Over" : "Click to play", canvas.width /
						2, canvas.height / 2);
				}
			}

			document.addEventListener("keydown", e => {
				const k = e.key.toLowerCase();
				let d = null;
				if (k === "arrowup" || k === "w") d = {
					x: 0,
					y: -1
				};
				if (k === "arrowdown" || k === "s") d = {
					x: 0,
					y: 1
				};
				if (k === "arrowleft" || k === "a") d = {
					x: -1,
					y: 0
				};
				if (k === "arrowright" || k === "d") d = {
					x: 1,
					y: 0
				};
				if (d && (d.x !== -dir.x || d.y !== -dir.y)) nextDir = d;
				if (d) e.preventDefault();
			});

			document.addEventListener("click", () => {
				if (!playing) start();
			});

			// initial idle state: compute the grid first, then center the snake
			playing = false;
			resize();
			const icx = Math.floor(cols / 2),
				icy = Math.floor(rows / 2);
			snake = [{
				x: icx,
				y: icy
			}, {
				x: icx - 1,
				y: icy
			}, {
				x: icx - 2,
				y: icy
			}];
			dir = {
				x: 1,
				y: 0
			};
			nextDir = dir;
			score = 0;
			spawnFood();
			draw();
		</script>
	</body>
</html>
